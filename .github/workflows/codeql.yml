name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '29 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@4774181674f4a1a18488bfc918b4c5ed1df39163 # main
    with:
      languages: javascript-typescript,actions
      run-codeql: true
      run-trivy: false
      run-dependency-review: false
