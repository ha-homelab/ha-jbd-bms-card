name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/change-scope.yml@42c1200e7ec4ce7ed32fa1c9e7492449b1f04b80 # main
    with:
      force-full: false
  browser-compatibility:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: ["scope"]
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/typescript-ci.yml@42c1200e7ec4ce7ed32fa1c9e7492449b1f04b80 # main
    with:
      node-version: '24'
      force-full: true
      run-node-ci: false
      browser-matrix-file: .github/browser-compatibility.json
      browser-platform-scope: all
      browser-required-profile: baseline
      browser-extended: false
      browser-prepare-command: npm ci --ignore-scripts
      browser-test-command: node scripts/browser-acceptance.cjs
  checks:
    name: Tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:docs
      - run: npm run check:ci
      - run: npm test
      - run: npm run build
      - name: Check HACS package
        run: node scripts/check-package.mjs
      - name: Test documentation-scope gate contracts
        run: python3 .github/workflow-tests/test_docs_scope.py
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Dashboard repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main; verified upstream main
        with:
          category: plugin
          comment: false
  gate:
    name: CI gate
    if: ${{ always() }}
    needs: ["browser-compatibility", "checks", "hacs", "scope"]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the exact selected validation path
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = ['browser-compatibility', 'checks', 'hacs', 'scope']
          always = ['checks', 'hacs', 'scope']
          if set(results) != set(expected):
              raise SystemExit('Validation job inventory differs')
          scope = results['scope']
          outputs = scope.get('outputs', {})
          run = outputs.get('run')
          if scope['result'] != 'success' or run not in {'true', 'false'}:
              raise SystemExit('Change scope did not succeed')
          if run == 'false' and outputs.get('reason') != 'documentation-only':
              raise SystemExit('Unproven documentation-only scope')
          failed = {}
          for name, value in results.items():
              wanted = 'success' if run == 'true' or name in always else 'skipped'
              if value['result'] != wanted:
                  failed[name] = {'actual': value['result'], 'expected': wanted}
          if failed:
              raise SystemExit(f'Validation did not pass: {failed}')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Require all checks
        if: ${{ needs.scope.outputs.run == 'true' }}
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          HACS_RESULT: ${{ needs.hacs.result }}
          BROWSER_RESULT: ${{ needs.browser-compatibility.result }}
          BROWSER_COVERAGE: ${{ needs.browser-compatibility.outputs.browser-coverage }}
        run: node scripts/check-browser-coverage.mjs
