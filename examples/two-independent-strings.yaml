# Synthetic entity IDs: replace every ID before use.
# Display ranges are illustrative, not charging or BMS protection settings.
# Requires a release with virtual_batteries support (not 0.2.0-beta.1).
type: custom:ha-jbd-bms-card
language: auto
title: Two independent series strings
virtual_batteries:
  - name: Main string
    topology: series
    subtitle: 4 physical packs in series / 16 cells total
    nominal_voltage: 51.2
    voltage_range: {min: 44.8, max: 58.4}
    current: sensor.main_string_current
    batteries:
      - name: Pack 1
        nominal_voltage: 12.8
        voltage_range: {min: 11.2, max: 14.6}
        soc: sensor.main_bms_1_soc
        voltage: sensor.main_bms_1_voltage
        current: sensor.main_bms_1_current
        temperature: sensor.main_bms_1_temperature
        cells:
          - sensor.main_bms_1_cell_1
          - sensor.main_bms_1_cell_2
          - sensor.main_bms_1_cell_3
          - sensor.main_bms_1_cell_4
      - name: Pack 2
        nominal_voltage: 12.8
        voltage_range: {min: 11.2, max: 14.6}
        soc: sensor.main_bms_2_soc
        voltage: sensor.main_bms_2_voltage
