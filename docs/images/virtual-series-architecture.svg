<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">Virtual battery data architecture</title><desc id="desc">Four physical packs, each with four cells and one BMS, feed an ESP32, Home Assistant, and a read-only virtual battery card.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#142340"/></linearGradient><linearGradient id="cyan" x2="1" y2="0"><stop stop-color="#32d7cf"/><stop offset="1" stop-color="#4ba9ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".2"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#6a8ba9" stroke-width="1.5"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e8f2ff}.muted{fill:#a1b7cb}.eyebrow{font-size:15px;letter-spacing:2px;font-weight:700;fill:#6be5dc}.title{font-size:38px;font-weight:750}.label{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.panel{fill:#14283d;stroke:#37546c;stroke-width:1.5;rx:22}.line{fill:none;stroke:#6a8ba9;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:5 7}.ok{fill:#6be5dc}.warn{fill:#ffd58a}.missing{fill:#ff9aab}</style>
<rect width="1440" height="840" rx="28" fill="url(#bg)"/><text x="62" y="57" class="eyebrow">JBD / VIRTUAL SERIES BATTERIES</text><text x="62" y="108" class="title">One virtual bank. Every physical pack. Every cell.</text><text x="62" y="143" class="body muted">Example: four 4S LiFePO₄ packs in one series string • 51.2 V nominal • 16 cells</text>
<rect x="50" y="178" width="1340" height="220" rx="26" fill="#101e31" stroke="#3c5e7b" stroke-dasharray="6 7"/><text x="72" y="211" class="small muted">PHYSICAL TOPOLOGY — EACH PACK KEEPS ITS OWN BMS</text><rect x="72" y="230" width="312" height="145" rx="18" fill="#192e45" stroke="#57d5e5" stroke-opacity=".5"/><text x="92" y="264" class="label">Pack 1</text><text x="92" y="293" class="body muted">BMS 1 · 12.8 V nominal</text><rect x="92" y="315" width="59" height="38" rx="9" fill="#57d5e5" fill-opacity=".15"/><text x="121.5" y="340" text-anchor="middle" class="small" style="fill:#57d5e5">C1</text><rect x="161" y="315" width="59" height="38" rx="9" fill="#57d5e5" fill-opacity=".15"/><text x="190.5" y="340" text-anchor="middle" class="small" style="fill:#57d5e5">C2</text><rect x="230" y="315" width="59" height="38" rx="9" fill="#57d5e5" fill-opacity=".15"/><text x="259.5" y="340" text-anchor="middle" class="small" style="fill:#57d5e5">C3</text><rect x="299" y="315" width="59" height="38" rx="9" fill="#57d5e5" fill-opacity=".15"/><text x="328.5" y="340" text-anchor="middle" class="small" style="fill:#57d5e5">C4</text><rect x="400" y="230" width="312" height="145" rx="18" fill="#192e45" stroke="#a995ff" stroke-opacity=".5"/><text x="420" y="264" class="label">Pack 2</text><text x="420" y="293" class="body muted">BMS 2 · 12.8 V nominal</text><rect x="420" y="315" width="59" height="38" rx="9" fill="#a995ff" fill-opacity=".15"/><text x="449.5" y="340" text-anchor="middle" class="small" style="fill:#a995ff">C1</text><rect x="489" y="315" width="59" height="38" rx="9" fill="#a995ff" fill-opacity=".15"/><text x="518.5" y="340" text-anchor="middle" class="small" style="fill:#a995ff">C2</text><rect x="558" y="315" width="59" height="38" rx="9" fill="#a995ff" fill-opacity=".15"/><text x="587.5" y="340" text-anchor="middle" class="small" style="fill:#a995ff">C3</text><rect x="627" y="315" width="59" height="38" rx="9" fill="#a995ff" fill-opacity=".15"/><text x="656.5" y="340" text-anchor="middle" class="small" style="fill:#a995ff">C4</text><rect x="728" y="230" width="312" height="145" rx="18" fill="#192e45" stroke="#5cdec1" stroke-opacity=".5"/><text x="748" y="264" class="label">Pack 3</text><text x="748" y="293" class="body muted">BMS 3 · 12.8 V nominal</text><rect x="748" y="315" width="59" height="38" rx="9" fill="#5cdec1" fill-opacity=".15"/><text x="777.5" y="340" text-anchor="middle" class="small" style="fill:#5cdec1">C1</text><rect x="817" y="315" width="59" height="38" rx="9" fill="#5cdec1" fill-opacity=".15"/><text x="846.5" y="340" text-anchor="middle" class="small" style="fill:#5cdec1">C2</text><rect x="886" y="315" width="59" height="38" rx="9" fill="#5cdec1" fill-opacity=".15"/><text x="915.5" y="340" text-anchor="middle" class="small" style="fill:#5cdec1">C3</text><rect x="955" y="315" width="59" height="38" rx="9" fill="#5cdec1" fill-opacity=".15"/><text x="984.5" y="340" text-anchor="middle" class="small" style="fill:#5cdec1">C4</text><rect x="1056" y="230" width="312" height="145" rx="18" fill="#192e45" stroke="#f1a5d8" stroke-opacity=".5"/><text x="1076" y="264" class="label">Pack 4</text><text x="1076" y="293" class="body muted">BMS 4 · 12.8 V nominal</text><rect x="1076" y="315" width="59" height="38" rx="9" fill="#f1a5d8" fill-opacity=".15"/><text x="1105.5" y="340" text-anchor="middle" class="small" style="fill:#f1a5d8">C1</text><rect x="1145" y="315" width="59" height="38" rx="9" fill="#f1a5d8" fill-opacity=".15"/><text x="1174.5" y="340" text-anchor="middle" class="small" style="fill:#f1a5d8">C2</text><rect x="1214" y="315" width="59" height="38" rx="9" fill="#f1a5d8" fill-opacity=".15"/><text x="1243.5" y="340" text-anchor="middle" class="small" style="fill:#f1a5d8">C3</text><rect x="1283" y="315" width="59" height="38" rx="9" fill="#f1a5d8" fill-opacity=".15"/><text x="1312.5" y="340" text-anchor="middle" class="small" style="fill:#f1a5d8">C4</text><path d="M720 398V432H270V478" class="line"/><text x="478" y="458" class="small muted">physical BMS readings over BLE</text>
<rect x="60" y="490" width="400" height="226" class="panel" filter="url(#shadow)"/><text x="86" y="528" class="eyebrow">01 / COLLECT</text><text x="86" y="568" class="label">ESP32 + ESPHome</text><text x="86" y="606" class="body muted">Physical pack and cell telemetry</text><text x="86" y="636" class="body muted">Supported profile + BMS mapping</text><text x="86" y="682" class="small ok">MQTT or encrypted native API</text>
<path d="M460 600H505" class="line"/><rect x="520" y="490" width="400" height="226" class="panel" filter="url(#shadow)"/><text x="546" y="528" class="eyebrow">02 / EXPOSE</text><text x="546" y="568" class="label">Home Assistant entities</text><text x="546" y="606" class="body muted">Explicit IDs, units and availability</text><text x="546" y="636" class="body muted">Optional upstream bank sensors</text><text x="546" y="682" class="small ok">Freshness validation belongs upstream</text>
<path d="M920 600H965" class="line"/><rect x="980" y="490" width="400" height="226" class="panel" filter="url(#shadow)"/><text x="1006" y="528" class="eyebrow">03 / DISPLAY</text><text x="1006" y="568" class="label">Virtual battery card</text><text x="1006" y="606" class="body muted">Complete voltage sum + pack detail</text><text x="1006" y="636" class="body muted">Individual cells remain traceable</text><text x="1006" y="682" class="small ok">Read-only • no controls or new entities</text>
<text x="62" y="765" class="body">Series: voltages add. Current and Ah do not add. Member SOC is not averaged.</text><text x="62" y="800" class="small muted">Illustrative data architecture, not a wiring or charging design. Nominal values are not live readings or charge targets.</text></svg>