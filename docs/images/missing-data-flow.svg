<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">Missing-data decision flow</title><desc id="desc">Availability gates precede separate voltage, cell-statistics and explicit-source paths. Missing inputs never become a partial sum or invented zero.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#142340"/></linearGradient><linearGradient id="cyan" x2="1" y2="0"><stop stop-color="#32d7cf"/><stop offset="1" stop-color="#4ba9ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".2"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#6a8ba9" stroke-width="1.5"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e8f2ff}.muted{fill:#a1b7cb}.eyebrow{font-size:15px;letter-spacing:2px;font-weight:700;fill:#6be5dc}.title{font-size:38px;font-weight:750}.label{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.panel{fill:#14283d;stroke:#37546c;stroke-width:1.5;rx:22}.line{fill:none;stroke:#6a8ba9;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:5 7}.ok{fill:#6be5dc}.warn{fill:#ffd58a}.missing{fill:#ff9aab}</style>
<rect width="1440" height="840" rx="28" fill="url(#bg)"/><text x="62" y="57" class="eyebrow">JBD / HONEST MISSING DATA</text><text x="62" y="108" class="title">Each result needs its own complete set of inputs.</text><text x="62" y="145" class="body muted">No partial voltage totals, invented zeroes, or automatic fallback from failed explicit sources.</text>
<rect x="60" y="200" width="280" height="480" class="panel"/><text x="86" y="240" class="eyebrow">AVAILABILITY GATE</text><text x="86" y="287" class="label">Group permitted?</text><text x="86" y="326" class="body muted">No gate configured, or</text><text x="86" y="356" class="body muted">gate reports an allowed</text><text x="86" y="386" class="body muted">online / true state.</text><path d="M86 425H314" stroke="#37546c"/><text x="86" y="466" class="body missing">Denied → hide summary</text><text x="86" y="497" class="body missing">and every member value.</text><text x="86" y="563" class="small muted">A member gate hides that pack.</text><text x="86" y="593" class="small muted">Online transport alone does</text><text x="86" y="618" class="small muted">not establish fresh BMS data.</text>
<path d="M340 440H366V271H393" class="line"/><path d="M366 440H393" class="line"/><path d="M366 440V611H393" class="line"/>
<rect x="410" y="200" width="490" height="142" class="panel"/><text x="434" y="238" class="eyebrow">PACK VOLTAGES</text><text x="434" y="277" class="body">All member voltages valid → sum in V</text><text x="434" y="310" class="body missing">Any member missing → no derived total</text><path d="M900 271H949" class="line"/><rect x="966" y="200" width="414" height="142" class="panel"/><text x="992" y="240" class="label">String voltage</text><text x="992" y="280" class="body muted">Nominal label never fills a gap.</text><text x="992" y="311" class="small muted">Other pack readings remain visible.</text>
<rect x="410" y="369" width="490" height="142" class="panel"/><text x="434" y="407" class="eyebrow">INDIVIDUAL CELLS</text><text x="434" y="446" class="body">All cells valid → minimum / maximum / spread</text><text x="434" y="479" class="body missing">Any cell missing → no complete-cell statistics</text><path d="M900 440H949" class="line"/><rect x="966" y="369" width="414" height="142" class="panel"/><text x="992" y="409" class="label">Pack + group statistics</text><text x="992" y="449" class="body muted">Observed cells remain visible.</text><text x="992" y="480" class="small muted">A valid pack-voltage source is independent.</text>
<rect x="410" y="540" width="490" height="142" class="panel"/><text x="434" y="578" class="eyebrow">EXPLICIT UPSTREAM BANK SENSOR</text><text x="434" y="617" class="body">Valid source → show that measurement</text><text x="434" y="650" class="body missing">Invalid source → missing, never silent fallback</text><path d="M900 611H949" class="line"/><rect x="966" y="540" width="414" height="142" class="panel"/><text x="992" y="580" class="label">Source-labelled result</text><text x="992" y="620" class="body muted">Separate from member completeness.</text><text x="992" y="651" class="small muted">Use an upstream gate for a stricter contract.</text>
<text x="62" y="746" class="body">This frontend validates numeric inputs. It does not certify freshness, simultaneity, or electrical safety.</text><text x="62" y="782" class="small muted">Illustrative display logic. Atomic telemetry, expiry and control decisions belong to the upstream consumer.</text></svg>