<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">Nominal series voltage: 1 to 4 LiFePO4 packs</title><desc id="desc">One 4S pack is 12.8 V nominal, two are 25.6 V, three are 38.4 V, and four are 51.2 V. Class labels are 12, 24, 36 and 48 V.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#142340"/></linearGradient><linearGradient id="cyan" x2="1" y2="0"><stop stop-color="#32d7cf"/><stop offset="1" stop-color="#4ba9ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".2"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#6a8ba9" stroke-width="1.5"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e8f2ff}.muted{fill:#a1b7cb}.eyebrow{font-size:15px;letter-spacing:2px;font-weight:700;fill:#6be5dc}.title{font-size:38px;font-weight:750}.label{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.panel{fill:#14283d;stroke:#37546c;stroke-width:1.5;rx:22}.line{fill:none;stroke:#6a8ba9;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:5 7}.ok{fill:#6be5dc}.warn{fill:#ffd58a}.missing{fill:#ff9aab}</style>
<rect width="1440" height="840" rx="28" fill="url(#bg)"/><text x="62" y="57" class="eyebrow">JBD / NOMINAL VOLTAGE</text><text x="62" y="108" class="title">Same 4S pack. Different series lengths.</text><text x="62" y="145" class="body muted">Illustrative LiFePO₄: 3.2 V per cell × 4 cells = 12.8 V nominal per physical pack</text><path d="M328 200V641" stroke="#29435b" stroke-dasharray="3 7"/><text x="328" y="680" class="small muted" text-anchor="middle">0 V</text><path d="M566 200V641" stroke="#29435b" stroke-dasharray="3 7"/><text x="566" y="680" class="small muted" text-anchor="middle">12.8 V</text><path d="M804 200V641" stroke="#29435b" stroke-dasharray="3 7"/><text x="804" y="680" class="small muted" text-anchor="middle">25.6 V</text><path d="M1042 200V641" stroke="#29435b" stroke-dasharray="3 7"/><text x="1042" y="680" class="small muted" text-anchor="middle">38.4 V</text><path d="M1280 200V641" stroke="#29435b" stroke-dasharray="3 7"/><text x="1280" y="680" class="small muted" text-anchor="middle">51.2 V</text><text x="62" y="238" class="label">1 physical pack</text><text x="62" y="268" class="body muted">4 cells · 12 V class</text><rect x="328" y="212" width="228" height="72" rx="12" fill="#57d5e5" fill-opacity=".2" stroke="#57d5e5" stroke-opacity=".6"/><text x="442" y="256" text-anchor="middle" class="body" style="fill:#57d5e5">12.8 V</text><text x="1358" y="255" text-anchor="end" class="label">12.8 V</text><text x="62" y="344" class="label">2 physical packs</text><text x="62" y="374" class="body muted">8 cells · 24 V class</text><rect x="328" y="318" width="228" height="72" rx="12" fill="#57d5e5" fill-opacity=".2" stroke="#57d5e5" stroke-opacity=".6"/><text x="442" y="362" text-anchor="middle" class="body" style="fill:#57d5e5">12.8 V</text><rect x="566" y="318" width="228" height="72" rx="12" fill="#a995ff" fill-opacity=".2" stroke="#a995ff" stroke-opacity=".6"/><text x="680" y="362" text-anchor="middle" class="body" style="fill:#a995ff">12.8 V</text><text x