" rx="18" fill="#1c3448"/><text x="84" y="746" class="body">Nominal total = number of physical packs × nominal voltage per pack</text><text x="84" y="776" class="small muted">Not a measured voltage, charge target, or chemistry detector. One 8S pack and two 4S packs can both be nominally 25.6 V.</text></svg>